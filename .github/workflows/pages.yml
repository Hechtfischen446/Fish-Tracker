name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # Alle 3 Stunden Seetemperaturen und Stationslisten aktualisieren
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten aktualisieren (Alplakes, MeteoSwiss, BAFU)
        run: node scripts/fetch-data.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
